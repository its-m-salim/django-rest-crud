{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Официант</title>
    <link rel="stylesheet" href="{% static 'create.css' %}">
</head>
<body>
    <div class="topbar">
        <a class="logo" href="{% url 'home' %}">Официант</a>
        <div class="links">
            <a class="active" href="{% url 'table' %}">Столы</a>
            <a href="{% url 'read' %}">Заказы</a>
        </div>
    </div>

    <div class="content">
        <h1>Новый заказ, стол {{ table.number }}</h1>

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label for="name">Имя гостя</label>
                <input type="text" name="name" id="name" required>
            </div>
            <div class="field">
                <label for="dish-select">Блюдо</label>
                <select name="dish" id="dish-select" required>
                    {% for dish in dishes %}
                    <option value="{{ dish.id }}">{{ dish.name }} — {{ dish.price }}</option>
                    {% empty %}
                    <option value="">Блюд пока нет</option>
                    {% endfor %}
                </select>
            </div>

            <div class="buttons">
                <button class="btn btn-main" type="submit">Сохранить</button>
                <a class="btn-ghost" href="{% url 'table' %}">Отмена</a>
            </div>
        </form>
    </div>
</body>
</html>
