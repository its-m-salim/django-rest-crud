{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'create.css' %}">
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <input type="text" placeholder="customer name" name="name">
        <label for="dish-select">Выберите блюдо</label>
        <select name="dish" id="dish-select">
            {% for dish in dishes %}
            <option value="{{dish.id}}">{{dish.name}}</option>
            {% empty %}
            <option value="">Кажется у вас пока нет блюд</option>
            {% endfor %}
        </select>
        <label for="table-select">Выберите стол </label>
        <select name="table" id="table-select">
            {% for table in tables %}
            <option value="{{table.id}}">стул {{table.id}}</option>
            {% empty %}
            <option value="">Кажется у вас пока нет свободных столов</option>
            {% endfor %}
        </select>
        <button type="submit">save</button>
    </form>
</body>
</html>
